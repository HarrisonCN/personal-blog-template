name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package static site
        run: |
          TAG="${{ github.event.release.tag_name }}"
          (cd dist && zip -qr "../personal-blog-template-${TAG}-dist.zip" .)
          git archive --format=zip -o "personal-blog-template-${TAG}-full.zip" HEAD
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.zip --clobber
